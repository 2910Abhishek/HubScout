# SearXNG settings for HubScout (merged over the image defaults).
# The secret key comes from the SEARXNG_SECRET env var (.env.infra), never from this file.
use_default_settings: true

general:
  instance_name: "HubScout search"

server:
  # Local, single-user instance: no bot limiter (it would need a separate Valkey).
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  # JSON is required: HubScout's web-search fallback calls /search?format=json.
  formats:
    - html
    - json
