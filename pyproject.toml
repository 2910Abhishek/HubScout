[project]
name = "hubscout"
version = "0.1.0"
description = "Multi-agent ML project architect: researched, constraint-checked and verified model/dataset/tooling blueprints."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Abhishek Parmar" }]
dependencies = [
    "defusedxml>=0.7,<1",
    "httpx>=0.28,<1",
    "huggingface-hub>=2.0,<3",
    "langchain-core>=1.6,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "redis>=8.1,<9",
]

[dependency-groups]
dev = [
    "bandit>=1.9,<2",
    "detect-secrets>=1.5,<2",
    "fakeredis[lua]>=2.38,<3",
    "langgraph-cli[inmem]>=0.4.32,<0.5",
    "mypy>=2.3,<3",
    "pip-audit>=2.10,<3",
    "pre-commit>=4.6,<5",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "python-dotenv>=1.2,<2",
    "respx>=0.23,<1",
    "ruff>=0.16.9,<0.17",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_servers", "verifier"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".langgraph_api"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"evals/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mcp_servers", "verifier"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "app.*"
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: live calls to external services; excluded from CI, run locally",
]

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
